<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>晶缘 | 今日水晶</title>
  <style>
    :root {
      --bg: #edf3f7;
      --surface: #f5f8fb;
      --surface-soft: #e8eff5;
      --ink: #263044;
      --muted: #64748b;
      --accent: #86a9bd;
      --sage: #a8c9b6;
      --peach: #efc3a5;
      --line: rgba(82, 103, 122, .16);
      --light: rgba(255, 255, 255, .92);
      --shade: rgba(122, 143, 163, .26);
      --shadow: 18px 20px 42px var(--shade), -16px -16px 34px var(--light);
      --shadow-sm: 9px 10px 22px rgba(122, 143, 163, .2), -8px -8px 18px rgba(255, 255, 255, .86);
      --inset: inset 8px 8px 16px rgba(122, 143, 163, .18), inset -8px -8px 16px rgba(255, 255, 255, .85);
      --radius: 32px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 88%, rgba(168, 201, 182, .28), transparent 30rem),
        radial-gradient(circle at 88% 20%, rgba(239, 195, 165, .22), transparent 28rem),
        var(--bg);
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 0;
    }

    button,
    select { font: inherit; }

    button { touch-action: manipulation; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      width: min(100%, 1280px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 22px clamp(14px, 3vw, 34px) 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 850;
      font-size: 22px;
    }

    .brand-mark,
    .round-icon {
      display: inline-grid;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }

    .brand-mark {
      width: 48px;
      height: 48px;
    }

    .brand svg,
    .icon {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .top-note {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      font-size: 14px;
      font-weight: 750;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 1.06fr) minmax(360px, .94fr);
      gap: clamp(24px, 5vw, 68px);
      align-items: center;
      min-height: calc(100dvh - 88px);
      padding: clamp(14px, 4vw, 52px) 0 22px;
    }

    .panel {
      position: relative;
      background: rgba(237, 243, 247, .96);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .input-panel {
      padding: clamp(22px, 4vw, 42px);
    }

    .intro-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      margin-bottom: 24px;
      padding: 0 16px;
      color: #5f7f92;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      font-size: 14px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(44px, 7vw, 78px);
      font-weight: 850;
      line-height: 1.02;
      letter-spacing: 0;
    }

    .headline-soft {
      display: block;
      color: var(--accent);
      text-shadow: 1px 1px 0 rgba(255, 255, 255, .75);
    }

    .subhead {
      max-width: 35rem;
      margin: 20px 0 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.82;
      font-weight: 500;
    }

    .form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 12px;
      padding: 16px;
      background: rgba(245, 248, 251, .58);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 24px;
      box-shadow: var(--inset);
    }

    .field-label,
    .field-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 850;
    }

    .label-icon {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: #5f7f92;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }

    .label-icon .icon {
      width: 19px;
      height: 19px;
    }

    .date-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      gap: 12px;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      position: absolute;
      top: 50%;
      right: 16px;
      width: 8px;
      height: 8px;
      content: "";
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: translateY(-62%) rotate(45deg);
      pointer-events: none;
    }

    select {
      width: 100%;
      min-height: 58px;
      padding: 0 42px 0 16px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      outline: none;
      appearance: none;
      font-weight: 800;
    }

    .themes {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .chip {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      font-weight: 850;
      transition: transform .18s var(--ease), box-shadow .18s ease, color .18s ease, background .18s ease;
    }

    .chip .icon {
      width: 18px;
      height: 18px;
    }

    .chip:hover {
      transform: translateY(-1px);
    }

    .chip[aria-pressed="true"] {
      color: #fff;
      background: var(--accent);
      box-shadow: 7px 8px 18px rgba(83, 118, 138, .28), -6px -6px 16px rgba(255, 255, 255, .74);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      font-weight: 550;
    }

    .submit-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-top: 4px;
    }

    .submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 62px;
      padding: 0 24px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 20px;
      box-shadow: 11px 12px 24px rgba(83, 118, 138, .34), -10px -10px 22px rgba(255, 255, 255, .82);
      cursor: pointer;
      font-weight: 900;
      transition: transform .18s var(--ease), box-shadow .18s ease;
    }

    .submit:hover {
      transform: translateY(-1px);
      box-shadow: 13px 14px 28px rgba(83, 118, 138, .36), -10px -10px 22px rgba(255, 255, 255, .86);
    }

    .submit:disabled {
      cursor: wait;
      opacity: .78;
      transform: none;
    }

    .reset {
      min-height: 52px;
      padding: 0 18px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      font-weight: 850;
    }

    select:focus-visible,
    .chip:focus-visible,
    .submit:focus-visible,
    .reset:focus-visible,
    .analysis-toggle:focus-visible,
    .energy-toggle:focus-visible,
    .carousel-arrow:focus-visible {
      outline: 3px solid rgba(134, 169, 189, .38);
      outline-offset: 3px;
    }

    .trust-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 22px;
      margin-top: 28px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .trust-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .trust-item .icon {
      width: 18px;
      height: 18px;
      color: var(--sage);
      stroke-width: 2.4;
    }

    .result-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      justify-self: center;
      width: min(100%, 590px);
      height: clamp(650px, calc(100dvh - 136px), 760px);
      min-height: 0;
      padding: clamp(16px, 2.6vw, 24px);
      overflow: hidden;
    }

    .result-panel::before {
      position: absolute;
      right: -80px;
      bottom: -90px;
      width: 260px;
      height: 260px;
      content: "";
      background: rgba(168, 201, 182, .26);
      border-radius: 999px;
      filter: blur(2px);
      pointer-events: none;
    }

    .result-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .result-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-size: 19px;
      font-weight: 900;
    }

    .round-icon {
      width: 42px;
      height: 42px;
      color: #fff;
      border-radius: 17px;
    }

    .ethical-pill {
      min-height: 38px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .result-body {
      position: relative;
      z-index: 1;
      min-height: 0;
      height: 100%;
      display: grid;
      overflow: hidden;
    }

    .empty-state,
    .loading-state {
      display: grid;
      align-content: center;
      gap: 22px;
      min-height: 0;
      height: 100%;
      padding: 14px;
    }

    .empty-card,
    .loading-card,
    .recommend-card,
    .alt-card {
      background: rgba(245, 248, 251, .68);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 28px;
      box-shadow: var(--shadow-sm);
    }

    .empty-card {
      display: grid;
      justify-items: center;
      gap: 16px;
      height: 100%;
      padding: clamp(28px, 5vw, 48px);
      text-align: center;
      align-content: center;
    }

    .empty-orb {
      display: grid;
      place-items: center;
      width: 116px;
      height: 116px;
      color: var(--accent);
      background: var(--surface-soft);
      border-radius: 36px;
      box-shadow: var(--inset);
    }

    .empty-orb .icon {
      width: 54px;
      height: 54px;
      stroke-width: 1.5;
    }

    .empty-card h2,
    .loading-card h2 {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.18;
    }

    .empty-card p,
    .loading-card p {
      max-width: 34rem;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
      font-weight: 560;
    }

    .loading-card {
      display: grid;
      gap: 24px;
      align-content: center;
      height: 100%;
      min-height: 0;
      padding: clamp(22px, 4vw, 40px);
    }

    .loading-top {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
    }

    .pulse-gem {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      color: var(--accent);
      background: var(--surface-soft);
      border-radius: 26px;
      box-shadow: var(--inset);
      animation: breathe 1.9s var(--ease) infinite;
    }

    .pulse-gem .icon {
      width: 36px;
      height: 36px;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    .progress-box {
      display: grid;
      gap: 10px;
      padding: 18px;
      background: var(--surface-soft);
      border-radius: 22px;
      box-shadow: var(--inset);
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 850;
    }

    .progress-track {
      height: 14px;
      overflow: hidden;
      background: rgba(255, 255, 255, .5);
      border-radius: 999px;
      box-shadow: var(--inset);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      transition: width .28s var(--ease);
    }

    .stage-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stage-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      padding: 0 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, .46);
      border-radius: 14px;
      font-size: 14px;
      font-weight: 750;
      opacity: .58;
    }

    .stage-list li.is-active {
      color: var(--ink);
      opacity: 1;
      box-shadow: var(--shadow-sm);
    }

    .stage-dot {
      width: 8px;
      height: 8px;
      background: var(--sage);
      border-radius: 50%;
    }

    .recommend-wrap {
      display: grid;
      gap: 16px;
    }

    .recommend-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .carousel-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }

    .carousel-frame {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      min-height: 0;
      height: 100%;
    }

    .carousel-track {
      display: flex;
      align-items: stretch;
      height: 100%;
      transform: translateX(0);
      transition: transform .42s var(--ease);
      will-change: transform;
    }

    .carousel-slide {
      flex: 0 0 100%;
      min-width: 100%;
      min-height: 0;
      height: 100%;
      padding: 0 2px 2px;
    }

    .carousel-nav {
      display: grid;
      grid-template-columns: 58px 1fr 58px;
      align-items: center;
      gap: 12px;
    }

    .carousel-arrow {
      display: inline-grid;
      place-items: center;
      width: 54px;
      height: 54px;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .18s var(--ease), box-shadow .18s ease;
    }

    .carousel-arrow:hover {
      transform: translateY(-1px);
    }

    .carousel-arrow.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .carousel-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 54px;
      padding: 0 14px;
      color: var(--muted);
      background: rgba(245, 248, 251, .62);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 20px;
      box-shadow: var(--inset);
      font-size: 14px;
      font-weight: 850;
    }

    .carousel-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .carousel-dot {
      width: 9px;
      height: 9px;
      background: rgba(100, 116, 139, .28);
      border-radius: 50%;
    }

    .carousel-dot.is-active {
      width: 24px;
      background: var(--accent);
      border-radius: 999px;
    }

    .recommend-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px 0;
    }

    .recommend-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      color: #fff;
      background: var(--accent);
      border-radius: 999px;
      box-shadow: 7px 8px 18px rgba(83, 118, 138, .24);
      font-size: 14px;
      font-weight: 900;
    }

    .score-bubble {
      display: grid;
      place-items: center;
      min-width: 68px;
      min-height: 48px;
      color: var(--ink);
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .score-bubble small {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .crystal-photo {
      display: block;
      width: calc(100% - 32px);
      aspect-ratio: 1.68;
      max-height: clamp(190px, 30dvh, 235px);
      margin: 14px auto 0;
      object-fit: cover;
      object-position: center;
      border-radius: 24px;
      box-shadow: var(--inset);
    }

    .hero-copy {
      padding: 16px 18px 4px;
      text-align: center;
    }

    .hero-copy h2 {
      margin: 0;
      font-size: clamp(26px, 3vw, 36px);
      line-height: 1.14;
      font-weight: 900;
    }

    .hero-copy p {
      max-width: 38rem;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.62;
      font-weight: 560;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 12px 16px 10px;
    }

    .metric {
      min-height: 82px;
      padding: 10px 8px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .metric .icon {
      width: 19px;
      height: 19px;
      margin-bottom: 5px;
      color: var(--accent);
    }

    .metric b {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 900;
    }

    .metric span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 760;
    }

    .metric .big {
      color: var(--ink);
      font-size: 23px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .lucky-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      background: var(--lucky-color);
      border: 2px solid rgba(38, 48, 68, .16);
      border-radius: 50%;
      vertical-align: -2px;
    }

    .analysis-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      margin: 0 auto 12px;
      padding: 0 18px;
      color: #5f7f92;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-weight: 900;
    }

    .analysis-panel {
      display: none;
      margin: 0 16px 16px;
      padding: 18px 20px;
      overflow: visible;
      scroll-margin-block: 18px;
      color: var(--muted);
      background: var(--surface-soft);
      border-radius: 22px;
      box-shadow: var(--inset);
      font-size: 15px;
      line-height: 1.84;
    }

    .analysis-panel.is-open { display: block; }
    .analysis-panel strong { color: var(--ink); }

    .alt-list {
      display: grid;
      gap: 12px;
    }

    .alt-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 2px 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
    }

    .alt-card {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 13px;
      align-items: center;
      padding: 12px;
    }

    .alt-card img {
      width: 88px;
      height: 70px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: var(--inset);
    }

    .alt-card h3 {
      margin: 0 0 5px;
      font-size: 18px;
      line-height: 1.2;
    }

    .alt-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 560;
    }

    .alt-score {
      color: var(--ink);
      font-size: 22px;
      font-weight: 950;

    function buildProfile(date) {
      const month = date.getMonth() + 1;

      const zodiac = getZodiac(month, day);
      const stemElements = ["wood", "wood", "fire", "fire", "earth", "earth", "metal", "metal", "water", "water"];
      const stemIndex = mod(year - 4, 10);
      const element = stemElements[stemIndex];
      return { zodiac, element, year, month, day };
    }

    function getZodiac(month, day) {
      const marks = [
        ["capricorn", 120], ["aquarius", 219], ["pisces", 321], ["aries", 420],

        ["virgo", 923], ["libra", 1023], ["scorpio", 1122], ["sagittarius", 1222],
        ["capricorn", 1232]
      ];
      const value = month * 100 + day;
      return marks.find(([, limit]) => value < limit)[0];
    }

    function getTopCrystals(profile, themes) {
      return crystals.map((crystal, index) => {
        const matchedThemes = themes.filter((theme) => crystal.themes.includes(theme));
        const themeScore = themes.length ? matchedThemes.length * 23 + (matchedThemes.length === themes.length ? 10 : 0) : 22;
        const elementScore = crystal.elements.includes(profile.element) ? 29 : 12;
        const zodiacScore = crystal.affinity.includes(profile.zodiac) ? 21 : 9;
        const rhythmScore = (profile.year + profile.month * 5 + profile.day + index * 7) % 8;
        const score = Math.min(98, Math.max(62, themeScore + elementScore + zodiacScore + rhythmScore));
        const energy = Math.min(5, Math.max(3.4, Math.round((score / 20) * 10) / 10));
        const basis = [
          themes.length ? `祈愿对应：${matchedThemes.length ? matchedThemes.map((item) => themeLabels[item]).join("、") : "作为辅助能量补位"}` : "祈愿对应：综合平衡",

        ];
        return { ...crystal, score, energy, basis };
      }).sort((a, b) => b.score - a.score).slice(0, 3);
    }

    function updateCarousel() {
      const track = document.querySelector("#carouselTrack");
      if (!track) return;
      const slides = [...document.querySelectorAll(".carousel-slide")];
      const total = slides.length;
      track.style.transform = `translateX(-${carouselIndex * 100}%)`;
      slides.forEach((slide, index) => {
        slide.setAttribute("aria-hidden", String(index !== carouselIndex));
      });
      document.querySelector("#carouselStatus").textContent = `Top ${carouselIndex + 1} / ${total}`;
      document.querySelector("#prevCrystal").classList.toggle("is-hidden", carouselIndex === 0);
      document.querySelector("#nextCrystal").classList.toggle("is-hidden", carouselIndex === total - 1);
      document.querySelectorAll(".carousel-dot").forEach((dot, index) => {
        dot.classList.toggle("is-active", index === carouselIndex);

    function runProgress(duration, done) {
      const start = performance.now();
      const checkpoints = [
        { at: 0, p: 3, text: "读取出生年月日" },
        { at: 520, p: 12, text: "换算太阳星座" },
        { at: 1160, p: 27, text: "计算年份五行" },
        { at: 1780, p: 39, text: "校验今日祈愿" },
        { at: 2640, p: 56, text: "匹配水晶属性" },
        { at: 3420, p: 70, text: "评估能量评分" },
        { at: 4380, p: 88, text: "生成适配解析" },
        { at: 5050, p: 100, text: "完成推荐" }
      ];
      let cursor = 0;
      const timer = setInterval(() => {
        const elapsed = performance.now() - start;
        while (cursor < checkpoints.length - 1 && elapsed >= checkpoints[cursor + 1].at) cursor += 1;
        const current = checkpoints[cursor];
        const next = checkpoints[Math.min(cursor + 1, checkpoints.length - 1)];
        const span = Math.max(1, next.at - current.at);
        const local = Math.min(1, Math.max(0, (elapsed - current.at) / span));
        const eased = 1 - Math.pow(1 - local, 2.6);
        const progress = Math.min(100, Math.round(current.p + (next.p - current.p) * eased));
        document.querySelector("#progressStage").textContent = current.text;
        document.querySelector("#progressPercent").textContent = `${progress}%`;
        document.querySelector("#progressBar").style.width = `${progress}%`;
        renderStageList(current.text);
        if (elapsed >= duration) {
          clearInterval(timer);
          document.querySelector("#progressStage").textContent = "完成推荐";
          document.querySelector("#progressPercent").textContent = "100%";
          document.querySelector("#progressBar").style.width = "100%";
          window.setTimeout(done, 260);
        }
      }, 120);
      timers.push(timer);
    }

    function renderStageList(activeText) {
      const list = document.querySelector("#stageList");
      if (!list) return;
      const stages = ["读取出生年月日", "换算太阳星座", "计算年份五行", "校验今日祈愿", "匹配水晶属性", "评估能量评分", "生成适配解析"];
      list.innerHTML = stages.slice(Math.max(0, stages.indexOf(activeText) - 2), stages.indexOf(activeText) + 3)
        .map((stage) => `<li class="${stage === activeText ? "is-active" : ""}"><span class="stage-dot"></span>${stage}</li>`)
        .join("");
    }

    function typeText(text, target, speed) {
      let index = 0;
      const timer = setInterval(() => {
        target.textContent = text.slice(0, index);
        index += 1;
        if (index > text.length) clearInterval(timer);
      }, speed);
      timers.push(timer);
    }

    function clearTimers() {
      timers.forEach((timer) => clearInterval(timer));
      timers = [];
    }

    function iconUse(id) {
      return `<svg class="icon" aria-hidden="true"><use href="#${id}"></use></svg>`;
    }

    function mod(value, divisor) {
      return ((value % divisor) + divisor) % divisor;
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }
  </script>
</body>
</html>
